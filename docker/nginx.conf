# Mimics GitHub Pages: the site is served under /docs/, directories are
# redirected to their trailing-slash URL, and 404.html is the error page.
server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;

    location = / {
        return 302 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /docs/404.html;
}
