# Mimics GitHub Pages: the site (build/) is served under /docs/, directories
# are redirected to their trailing-slash URL, and 404.html is the error page.
server {
    listen 80;
    absolute_redirect off;

    location = / {
        return 302 /docs/;
    }

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        alias /srv/build/;
        try_files $uri $uri/ =404;
        error_page 404 /docs/404.html;
    }
}
